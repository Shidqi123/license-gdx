<!DOCTYPE html>
<html lang="id">
  <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>GDX TOOLS - LICENSE GENERATOR</title>
      <style>
                :root { --neon-red: #FF0000; --red-glow: rgba(255, 0, 0, 0.4); }
                * { box-sizing: border-box; margin: 0; padding: 0; }
                body { background-color: #000; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; position: relative; }
                .container { text-align: center; background: #0a0a0a; padding: 40px 30px; border-radius: 25px; border: 2px solid var(--neon-red); box-shadow: 0 0 30px rgba(255,0,0,0.3); max-width: 380px; width: 90%; animation: fadeIn 0.8s ease-out; position: relative; z-index: 1; }
                @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
                h1 { color: var(--neon-red); font-size: 24px; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 2px; font-weight: 900; }
                .instruction { font-size: 13px; opacity: 0.6; line-height: 1.5; margin-bottom: 25px; }
                .key-box { background: #111; padding: 20px; border-radius: 15px; font-size: 28px; font-weight: 800; color: #fff; border: 1px solid #222; margin: 20px 0; letter-spacing: 2px; box-shadow: inset 0 0 10px rgba(0,0,0,0.5); }
                .copy-btn { background: var(--neon-red); color: #fff; border: none; padding: 16px; border-radius: 12px; cursor: pointer; font-weight: bold; font-size: 15px; transition: 0.3s; width: 100%; text-transform: uppercase; box-shadow: 0 5px 15px rgba(255,0,0,0.3); }
                .copy-btn:active { transform: scale(0.95); }
                .footer { margin-top: 30px; font-size: 10px; opacity: 0.4; letter-spacing: 1px; }
                .toast-pro { position: absolute; top: 25px; left: 50%; transform: translateX(-50%); width: calc(100% - 40px); max-width: 340px; background: rgba(20, 20, 20, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(255, 0, 0, 0.4); border-radius: 12px; padding: 14px 20px; z-index: 10000; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); transition: 0.5s; }
                .toast-pro.hidden { top: -100px; opacity: 0; }
                .toast-pro-content { display: flex; align-items: center; gap: 12px; }
                .toast-pro-icon { width: 22px; height: 22px; background: var(--neon-red); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 12px; color: white; }
                #toast-pro-msg { font-size: 13px; font-weight: 600; color: white; }
                .toast-pro-progress { position: absolute; bottom: 0; left: 0; height: 2px; background: var(--neon-red); width: 100%; }
                @keyframes toastProgress { from { width: 100%; } to { width: 0%; } }
                .toast-pro:not(.hidden) .toast-pro-progress { animation: toastProgress 3s linear forwards; }
            </style>
  </head>
  <body>
        <div id="premium-toast" class="toast-pro hidden">
                  <div class="toast-pro-content">
                                <span class="toast-pro-icon">V</span>span>
                                <span id="toast-pro-msg">Berhasil Disalin!</span>span>
                  </div>div>
                  <div class="toast-pro-progress"></div>div>
        </div>div>
        <div class="container">
                  <h1>TOKEN LISENSI</h1>
                <p class="instruction">Salin kode lisensi di bawah ini dan masukkan ke aplikasi GDX Tools Anda.</p>p>
                <div class="key-box" id="keyDisplay">GDX-XXXX-PRO</div>div>
                <button class="copy-btn" onclick="copyKey()">SALIN KODE</button>button>
                <p class="footer">Token ini diperbarui secara otomatis setiap hari.</p>p>
        </div>div>
      <script>
                function generateKey() {
                              const now = new Date();
                              const dateStr = now.getFullYear() + String(now.getMonth() + 1).padStart(2, '0') + String(now.getDate()).padStart(2, '0');
                              return "GDX-" + dateStr + "-PRO";
                }
                const key = generateKey();
                document.getElementById('keyDisplay').innerText = key;
                function copyKey() {
                              const tempInput = document.createElement("input");
                              tempInput.value = key;
                              document.body.appendChild(tempInput);
                              tempInput.select();
                              document.execCommand("copy");
                              document.body.removeChild(tempInput);
                              showToastPro("Kode Berhasil Disalin!");
                }
                function showToastPro(msg) {
                              const toast = document.getElementById('premium-toast');
                              document.getElementById('toast-pro-msg').innerText = msg;
                              toast.classList.remove('hidden');
                              setTimeout(() => { toast.classList.add('hidden'); }, 3000);
                }
      </script>
  </body>
</html>html>
      </script></h1>
  </body>
      </style></title>
  </head>
