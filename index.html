<!DOCTYPE html>
<html lang="id">
  <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>GDX TOOLS - LICENSE GENERATOR</title>
      <style>
                body {
                              background-color: #000;
                              color: #fff;
                              font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                              display: flex;
                              justify-content: center;
                              align-items: center;
                              height: 100vh;
                              margin: 0;
                              overflow: hidden;
                }
                .container {
                              text-align: center;
                              background: #111;
                              padding: 40px;
                              border-radius: 20px;
                              border: 2px solid #333;
                              box-shadow: 0 0 20px rgba(255, 0, 0, 0.1);
                              max-width: 400px;
                              width: 90%;
                }
                h1 {
                              color: #f00;
                              font-size: 24px;
                              margin-bottom: 20px;
                              text-transform: uppercase;
                              letter-spacing: 2px;
                              text-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
                }
                .key-box {
                              background: #222;
                              padding: 20px;
                              border-radius: 10px;
                              font-family: 'Courier New', Courier, monospace;
                              font-size: 22px;
                              font-weight: bold;
                              color: #fff;
                              margin: 20px 0;
                              border: 1px solid #444;
                              letter-spacing: 1px;
                }
                .instruction {
                              font-size: 14px;
                              opacity: 0.7;
                              margin-bottom: 10px;
                }
                .copy-btn {
                              background: #f00;
                              color: #fff;
                              border: none;
                              padding: 12px 30px;
                              border-radius: 50px;
                              font-weight: bold;
                              cursor: pointer;
                              transition: all 0.3s ease;
                              text-transform: uppercase;
                              box-shadow: 0 0 15px rgba(255, 0, 0, 0.4);
                }
                .copy-btn:hover {
                              background: #d00;
                              transform: scale(1.05);
                              box-shadow: 0 0 20px rgba(255, 0, 0, 0.6);
                }
                #toast-container {
                              position: fixed;
                              top: -100px;
                              left: 50%;
                              transform: translateX(-50%);
                              z-index: 1000;
                              transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
                              width: 320px;
                }
                #toast-container.show {
                              top: 20px;
                }
                .premium-toast {
                              background: rgba(15, 15, 15, 0.8);
                              backdrop-filter: blur(10px);
                              border: 1px solid rgba(255, 0, 0, 0.5);
                              border-radius: 12px;
                              padding: 15px 20px;
                              display: flex;
                              align-items: center;
                              gap: 12px;
                              box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 15px rgba(255, 0, 0, 0.2);
                              position: relative;
                              overflow: hidden;
                }
                .toast-icon {
                              width: 24px;
                              height: 24px;
                              background: #f00;
                              border-radius: 50%;
                              display: flex;
                              justify-content: center;
                              align-items: center;
                              font-weight: bold;
                              font-size: 14px;
                              box-shadow: 0 0 10px rgba(255, 0, 0, 0.8);
                }
                .toast-content {
                              flex: 1;
                }
                .toast-title {
                              font-weight: bold;
                              font-size: 14px;
                              color: #fff;
                              margin: 0;
                }
                .toast-msg {
                              font-size: 12px;
                              color: rgba(255, 255, 255, 0.7);
                              margin: 2px 0 0 0;
                }
                .progress-bar {
                              position: absolute;
                              bottom: 0;
                              left: 0;
                              height: 3px;
                              background: #f00;
                              width: 100%;
                              transition: width 3s linear;
                              box-shadow: 0 0 5px #f00;
                }
            </style>
  </head>
  <body>
        <div id="toast-container">
                  <div class="premium-toast">
                                <div class="toast-icon">V</div>div>
                                <div class="toast-content">
                                                  <p class="toast-title">Berhasil!</p>p>
                                                  <p class="toast-msg">Kode lisensi telah disalin.</p>p>
                                </div>div>
                                <div class="progress-bar" id="toastProgress"></div>div>
                  </div>div>
        </div>div>
        <div class="container">
                  <h1>TOKEN LISENSI HARI INI</h1>
                <p class="instruction">Silakan salin kode di bawah ini dan masukkan ke aplikasi GDX Tools Anda.</p>p>
                <div class="key-box" id="keyDisplay">GDX-20260504-PRO</div>div>
                <button class="copy-btn" id="copyBtn">SALIN KODE</button>button>
                <p style="margin-top:20px; font-size:12px; opacity:0.5;">Token ini diperbarui secara otomatis setiap hari.</p>p>
        </div>div>
      <script>
                document.getElementById('copyBtn').addEventListener('click', function() {
                              const keyText = document.getElementById('keyDisplay').innerText;
                              navigator.clipboard.writeText(keyText).then(() => {
                                                showToast();
                              });
                });
                function showToast() {
                              const container = document.getElementById('toast-container');
                              const progress = document.getElementById('toastProgress');
                              progress.style.width = '100%';
                              container.classList.add('show');
                              setTimeout(() => {
                                                progress.style.width = '0%';
                              }, 10);
                              setTimeout(() => {
                                                container.classList.remove('show');
                              }, 3000);
                }
      </script>
  </body>
</html>html>
      </script></h1>
  </body>
      </style></title>
  </head>
